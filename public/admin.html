<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Správce – Minecraft Velký svět</title>
<style>:root{font-family:system-ui,sans-serif;color:#e7f7e9;background:#0e1c1b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#10291e,#10172c);min-height:100vh}header{padding:24px 5%;background:#184b2d;border-bottom:3px solid #61bf69}h1{margin:0;font-size:clamp(24px,4vw,36px)}main{max-width:1000px;margin:24px auto;padding:0 16px}a{color:#8de7ff}nav{padding:15px 5%;background:#0b1919}.card{padding:20px;margin:18px 0;border:1px solid #40675b;border-radius:15px;background:#173032}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #5b857e;color:white}input{background:#243f43;max-width:260px}button{background:#267f4b;cursor:pointer;margin:4px}button:hover{filter:brightness(1.15)}.hidden{display:none}.muted{color:#afc9bd}.task{padding:13px 0;border-bottom:1px solid #3d5954}.status{font-weight:700}small{color:#b9cbbf}#build-details p{margin-bottom:6px}#build-details{overflow-wrap:anywhere}</style></head>
<body><header><h1>👑 Správce – Minecraft Velký svět</h1><p>Schvalování úkolů a kontrola nasazení</p></header><nav><a href="./index.html">← Zpět na Minecraft web</a></nav>
<main><section class="card" id="login"><h2>🔐 Přihlášení správce 10miki10</h2><p class="muted">Přihlášení platí 2 hodiny. PIN se neukládá do prohlížeče.</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN správce"><button id="signin">Odemknout</button><p id="login-message" class="muted"></p></section>
<div id="dashboard" class="hidden"><section class="card"><h2>👑 Administrace</h2><p id="session-expiry" class="muted"></p><button id="signout">🔒 Odhlásit</button></section>
<section class="card"><h2>📨 Úkoly čekající na schválení</h2><div id="pending">Načítám…</div><button id="refresh-tasks">↻ Obnovit úkoly</button></section>
<section class="card"><h2>🚀 Aktuální nasazení</h2><p id="build-status" class="status">Načítám…</p><div id="build-details"></div><button id="refresh-build">↻ Obnovit nasazení</button></section></div></main>
<script>
const KEY="minecraft_admin_session_v1",login=document.getElementById("login"),dashboard=document.getElementById("dashboard"),msg=document.getElementById("login-message");let token="",expires=0;
const api=async(path,body)=>{const r=await fetch("/api/"+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),cache:"no-store"});const x=await r.json();if(!r.ok)throw Error(x.error||"Požadavek selhal");return x};
function clearLocal(){localStorage.removeItem(KEY);token="";expires=0;dashboard.classList.add("hidden");login.classList.remove("hidden")}
function expire(){clearLocal();msg.textContent="Přihlášení vypršelo. Zadej znovu PIN."}
function checkExpiry(){if(!token||Date.now()>=expires){expire();return false}return true}
function sessionUI(){login.classList.add("hidden");dashboard.classList.remove("hidden");document.getElementById("session-expiry").textContent="Přihlášeno do "+new Date(expires).toLocaleString("cs-CZ",{timeZone:"Europe/Prague"});refreshTasks();refreshBuild()}
document.getElementById("signin").onclick=async()=>{const pin=document.getElementById("pin").value;msg.textContent="Ověřuji přihlášení…";try{const r=await api("admin/verify",{pin});document.getElementById("pin").value="";token=r.token;expires=r.expires_at;localStorage.setItem(KEY,JSON.stringify({token,expires}));msg.textContent="";sessionUI()}catch(e){msg.textContent="⚠️ "+e.message}};
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("signin").click()});
document.getElementById("signout").onclick=async()=>{const old=token;clearLocal();msg.textContent="Odhlášeno.";try{await api("admin/logout",{token:old})}catch{}};
async function refreshTasks(){if(!checkExpiry())return;const root=document.getElementById("pending");root.textContent="Načítám…";try{const r=await fetch("/api/quests",{cache:"no-store"}),data=await r.json();if(!r.ok)throw Error(data.error||"Nelze načíst úkoly");const pending=data.tasks.filter(x=>x.status==="pending");root.replaceChildren();if(!pending.length){root.textContent="✅ Žádné úkoly nečekají na schválení.";return}for(const t of pending){const div=document.createElement("div");div.className="task";const title=document.createElement("strong");title.textContent=t.name;const details=document.createElement("p");details.className="muted";details.textContent="👤 "+t.player+" · "+t.reward+(t.currency==="diamond"?" 💎":" 💚");div.append(title,details);for(const [label,endpoint] of [["💎 Schválit a odměnit","quests/approve"],["↩️ Vrátit k doplnění","quests/reject"]]){const b=document.createElement("button");b.textContent=label;b.onclick=async()=>{if(!checkExpiry())return;b.disabled=true;try{await api(endpoint,{id:t.id,token});await refreshTasks()}catch(e){if(/vypršelo/.test(e.message))expire();else alert(e.message);b.disabled=false}};div.append(b)}root.append(div)}}catch(e){root.textContent="⚠️ "+e.message}}
async function refreshBuild(){if(!checkExpiry())return;const status=document.getElementById("build-status"),details=document.getElementById("build-details");status.textContent="Načítám aktuální nasazení…";details.replaceChildren();try{const data=await api("admin/deploy",{token});if(!checkExpiry())return;const b=data.build;if(!b){status.textContent="Žádné nasazení nenalezeno.";return}const st=String(b.outcome||b.status||"unknown").toLowerCase();const labels={success:"✅ Úspěšně nasazeno",succeeded:"✅ Úspěšně nasazeno",ready:"✅ Úspěšně nasazeno",fail:"❌ Nasazení selhalo",failed:"❌ Nasazení selhalo",failure:"❌ Nasazení selhalo",queued:"⏳ Ve frontě",pending:"⏳ Čeká",running:"🔄 Probíhá",building:"🔄 Sestavování",in_progress:"🔄 Probíhá",skipped:"⏭️ Přeskočeno"};status.textContent=labels[st]||"Stav: "+st;const p=document.createElement("p");p.textContent=b.message||b.commit||"Bez popisu změny";const small=document.createElement("small");small.textContent=(b.branch||"main")+(b.created_at?" · "+new Date(b.created_at).toLocaleString("cs-CZ",{timeZone:"Europe/Prague"}):"");details.append(p,small)}catch(e){if(/vypršelo/.test(e.message))expire();else status.textContent="⚠️ "+e.message}}
document.getElementById("refresh-tasks").onclick=refreshTasks;document.getElementById("refresh-build").onclick=refreshBuild;
setInterval(()=>{if(token){if(!checkExpiry())return;if(!document.hidden){refreshTasks();refreshBuild()}}},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&token){if(checkExpiry()){refreshTasks();refreshBuild()}}});
try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&typeof saved.token==="string"&&Number.isFinite(saved.expires)&&saved.expires>Date.now()){token=saved.token;expires=saved.expires;api("admin/session",{token}).then(r=>{if(r.ok)sessionUI();else expire()}).catch(()=>{clearLocal();msg.textContent="Přihlášení se nepodařilo ověřit."})}else localStorage.removeItem(KEY)}catch{localStorage.removeItem(KEY)}
</script></body></html>
